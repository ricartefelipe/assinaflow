name: Sync master with develop

# Como a master está protegida (merge só via PR), criamos/atualizamos um PR develop → master e
# fazemos merge com o próprio GITHUB_TOKEN. Isto substitui o force-push.
#
# Requisitos nas branch rules da master:
# - sem reviews obrigatórios para este cenário OU bypass para github-actions — caso contrário
#   gh pr merge falha e será preciso configurar approvals/bypass nos rulesets.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: sync-master-with-develop
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abrir ou reutilizar PR develop → master e fazer merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin master develop

          MASTER=$(git rev-parse origin/master)
          DEV=$(git rev-parse origin/develop)

          if [[ "$MASTER" == "$DEV" ]]; then
            echo "master já aponta para o mesmo commit que develop."
            exit 0
          fi

          REPO="${{ github.repository }}"

          OPEN=$(gh pr list --repo "$REPO" --base master --head develop --state open --json number -q '.[0].number // empty')
          if [[ -z "${OPEN:-}" ]] || [[ "$OPEN" == "null" ]]; then
            gh pr create \
              --repo "$REPO" \
              --base master \
              --head develop \
              --title 'chore(sync): alinhar master com develop [automático]' \
              --body 'Criado automaticamente pelo workflow *Sync master with develop*. Pode ignorar revisão manual se merge passar só com Actions.'
          fi

          PR=$(gh pr list --repo "$REPO" --base master --head develop --state open --json number -q '.[0].number')

          echo "Fazendo merge do PR #$PR"
          gh pr merge "$PR" --repo "$REPO" --merge || {
            echo "::error ::gh pr merge falhou (reviews obrigatórios, falta de permissão ou conflitos)."
            echo "Ajuste das rules na master ou faça merge manual do PR #$PR."
            exit 1
          }
