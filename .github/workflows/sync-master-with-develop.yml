name: Sync master with develop

# Integra os commits de develop em master via Merge API do GitHub (merge commit sem force-push).
# Serve quando master está protegida contra push direto / force-push do GITHUB_TOKEN.
#
# Se o merge falhar (ex.: obrigatório review humano sem bypass para Actions), ajustar as regras
# da branch ou fazer merge develop → master manualmente no GitHub.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: sync-master-with-develop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar develop em master (Merge API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin master develop

          MASTER=$(git rev-parse origin/master)
          DEV=$(git rev-parse origin/develop)

          if [[ "$MASTER" == "$DEV" ]]; then
            echo "master já aponta para o mesmo commit que develop."
            exit 0
          fi

          if gh api "repos/${{ github.repository }}/merges" \
            --method POST \
            -f base=master \
            -f head=develop \
            -f commit_title='Merge branch develop into master (sync automático)' \
            -f commit_message='Synchronization via Actions after push to develop.' \
            >/dev/null; then
            echo "Merge concluído com sucesso."
            exit 0
          fi

          echo "::error ::POST /merges falhou (provável causa: branch rules na master)."
          echo "Possíveis correcções: permitir merges via GitHub Actions na ruleset,"
          echo "ou abrir/manualmente um PR develop → master e fazer merge."
          exit 1
