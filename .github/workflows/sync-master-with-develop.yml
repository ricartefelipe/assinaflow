name: Verificar develop para PR manual

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar CI do commit atual de develop
        uses: actions/github-script@v7
        with:
          script: |
            const checkDevelopCi = require('./.github/scripts/check-develop-ci.cjs');
            const result = await checkDevelopCi({ github, context });
            core.setOutput('validated-sha', result.sha);
            core.setOutput('manual-pr-url', result.prUrl);
            await core.summary
              .addHeading('develop validado para revisão manual')
              .addRaw(`Commit validado: ${result.sha}\n\n`)
              .addLink('Ver commit', result.commitUrl)
              .addRaw('\n\n')
              .addLink('CI concluída com success', result.runUrl)
              .addRaw('\n\n')
              .addLink('Abrir PR develop → master manualmente', result.prUrl)
              .addRaw('\n\nEsta checagem não cria PR nem realiza merge.\n')
              .write();
