name: Sync master with develop

# Após cada push em `develop`, avança `master` para o mesmo commit (`reset --hard`
# para `origin/develop` + push com `--force-with-lease`).
#
# Árvores de `master` e `develop` ficam sempre iguais após esta corrida — não é
# necessário abrir PR só para “alinhar branches”; PRs repetidos desenvolvimento ↔
# master apenas empilham merges vazios. Use PR quando houver código a rever; para
# alinhar ponteiros, pode também correr este workflow manualmente (workflow_dispatch).
#
# A decisão de release continua a ser humana; isto apenas evita `master` ficar
# visualmente atrás quando o trabalho habitual é em `develop`.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: sync-master-with-develop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance master to match develop
        run: |
          set -euo pipefail
          git fetch origin master develop
          git checkout master
          git reset --hard origin/develop
          git push origin master --force-with-lease
